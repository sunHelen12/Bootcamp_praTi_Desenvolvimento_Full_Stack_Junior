<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio CSS - Versão 1: CSS Global</title>
    <style>
        
        :root {
            --color-primary: #007bff;
            --color-primary-hover: #0056b3;
            --color-text: #212529;
            --color-background: #f8f9fa;
            --color-surface: #ffffff;
            --color-border: #dee2e6;
            --color-success: #28a745;
            --color-rating: #ffc107;
            --color-skeleton: #e0e0e0;

            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);

            --spacing-1: 0.25rem;
            --spacing-2: 0.5rem;
            --spacing-3: 0.75rem;
            --spacing-4: 1rem;
            --spacing-6: 1.5rem;
            --spacing-8: 2rem;

            --radius-md: 0.375rem;
            --radius-full: 9999px;
            
            --transition-duration: 200ms;
        }

        [data-theme="dark"] {
            --color-primary: #389bff;
            --color-primary-hover: #5caeff;
            --color-text: #f8f9fa;
            --color-background: #121212;
            --color-surface: #1e1e1e;
            --color-border: #444;
            --color-skeleton: #333;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--color-background);
            color: var(--color-text);
            transition: background-color var(--transition-duration), color var(--transition-duration);
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }        

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-3) var(--spacing-4);
            background-color: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            box-shadow: var(--shadow-sm);
            z-index: 10;
            transition: background-color var(--transition-duration), border-color var(--transition-duration);
        }

        .navbar__logo {
            font-weight: bold;
            font-size: 1.25rem;
        }

        .navbar__actions {
            display: flex;
            align-items: center;
            gap: var(--spacing-4);
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--color-text);
            line-height: 1;
            padding: var(--spacing-1);
            border-radius: var(--radius-full);
        }
        .theme-toggle:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        .cart-badge {
            position: relative;
            font-size: 1.5rem;
        }

        .cart-badge__count {
            position: absolute;
            top: -5px;
            right: -10px;
            background-color: var(--color-primary);
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            width: 20px;
            height: 20px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .main-content {
            padding: calc(65px + var(--spacing-6)) var(--spacing-4) var(--spacing-6); /* 65px é a altura aproximada do navbar */
        }

        .product-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--spacing-6);
        }

        /* Media Queries para responsividade do grid */
        @media (min-width: 481px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (min-width: 769px) {
            .product-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (min-width: 1025px) {
            .product-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .product-card {
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform var(--transition-duration), box-shadow var(--transition-duration);
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .product-card__image-wrapper {
            aspect-ratio: 1 / 1;
            background-color: var(--color-skeleton);
            position: relative;
        }
        .product-card__tag {
            position: absolute;
            top: var(--spacing-2);
            right: var(--spacing-2);
            background-color: var(--color-success);
            color: white;
            padding: var(--spacing-1) var(--spacing-2);
            font-size: 0.8rem;
            border-radius: var(--radius-md);
            font-weight: 500;
        }

        .product-card__image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .product-card__content {
            padding: var(--spacing-4);
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-card__title {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.4;
            height: 2.8em; 
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            margin-bottom: var(--spacing-2);
        }
        
        .product-card__details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-3);
        }

        .product-card__price {
            font-size: 1.125rem;
            font-weight: bold;
            color: var(--color-primary);
        }

        .product-card__rating {
            display: flex;
            align-items: center;
            gap: var(--spacing-1);
        }
        
        .product-card__rating span {
           color: var(--color-rating);
        }
        
        .product-card__footer {
            margin-top: auto;
        }

        .button {
            width: 100%;
            padding: var(--spacing-2) var(--spacing-4);
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            cursor: pointer;
            transition: background-color var(--transition-duration), color var(--transition-duration), border-color var(--transition-duration), opacity var(--transition-duration);
            text-align: center;
        }

        .button:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }
        
        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .button--solid {
            background-color: var(--color-primary);
            color: white;
        }
        .button--solid:hover:not(:disabled) {
            background-color: var(--color-primary-hover);
        }

        .button--outline {
            background-color: transparent;
            color: var(--color-primary);
            border-color: var(--color-primary);
        }
        .button--outline:hover:not(:disabled) {
            background-color: var(--color-primary);
            color: white;
        }

        .button--ghost {
            background-color: transparent;
            color: var(--color-primary);
            border-color: transparent;
        }
        .button--ghost:hover:not(:disabled) {
            background-color: rgba(0, 123, 255, 0.1);
        }

        .skeleton {
            background-color: var(--color-skeleton);
            border-radius: var(--radius-md);
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            50% { opacity: 0.5; }
        }

        .skeleton-card__image {
            aspect-ratio: 1 / 1;
        }
        .skeleton-card__content {
             padding: var(--spacing-4);
        }
        .skeleton-card__title {
            height: 1rem;
            width: 80%;
            margin-bottom: var(--spacing-3);
        }
        .skeleton-card__text {
            height: 0.8rem;
            width: 50%;
        }
    </style>
</head>
<body>

    <nav class="navbar" aria-label="Navegação principal">
        <div class="navbar__logo">Minha Loja</div>
        <div class="navbar__actions">
            <button class="theme-toggle" id="theme-toggle" aria-label="Alternar tema">
                <span class="sun-icon">☀️</span>
                <span class="moon-icon" style="display: none;">🌙</span>
            </button>
            <div class="cart-badge" aria-label="Carrinho de compras">
                🛒
                <div class="cart-badge__count" aria-live="polite">3</div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="product-grid" id="product-grid">
        </div>
    </main>

    <template id="product-card-template">
        <article class="product-card">
            <div class="product-card__image-wrapper">
                <img class="product-card__image" src="" alt="" loading="lazy">
                <span class="product-card__tag"></span>
            </div>
            <div class="product-card__content">
                <h3 class="product-card__title"></h3>
                <div class="product-card__details">
                    <span class="product-card__price"></span>
                    <div class="product-card__rating" aria-label="Avaliação">
                        <span>★</span>
                        <span></span>
                    </div>
                </div>
                <div class="product-card__footer">
                    <button class="button button--solid">Adicionar</button>
                </div>
            </div>
        </article>
    </template>
    
    <template id="skeleton-card-template">
         <div class="product-card">
            <div class="skeleton skeleton-card__image"></div>
            <div class="skeleton-card__content">
                <div class="skeleton skeleton-card__title"></div>
                <div class="skeleton skeleton-card__text"></div>
            </div>
        </div>
    </template>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const products = [
                { id: 1, title: 'Produto Incrível de Alta Qualidade com Nome Longo para Teste de Elipse', price: 199.90, rating: 4.5, tag: 'Novo', image: 'https://placehold.co/400x400/007bff/white?text=Produto+1' },
                { id: 2, title: 'Item Moderno e Sofisticado', price: 249.00, rating: 4.8, tag: 'Promo', image: 'https://placehold.co/400x400/28a745/white?text=Produto+2' },
                { id: 3, title: 'Solução Prática para o Dia a Dia', price: 89.99, rating: 4.2, tag: null, image: 'https://placehold.co/400x400/ffc107/black?text=Produto+3' },
                { id: 4, title: 'Gadget Tecnológico Essencial', price: 599.50, rating: 5.0, tag: 'Novo', image: 'https://placehold.co/400x400/dc3545/white?text=Produto+4' },
                { id: 5, title: 'Acessório Elegante e Discreto', price: 120.00, rating: 4.6, tag: 'Promo', image: 'https://placehold.co/400x400/17a2b8/white?text=Produto+5' },
                { id: 6, title: 'Produto Básico para Começar', price: 49.90, rating: 3.9, tag: null, image: 'https://placehold.co/400x400/6c757d/white?text=Produto+6' },
            ];
            
            const themeToggle = document.getElementById('theme-toggle');
            const sunIcon = document.querySelector('.sun-icon');
            const moonIcon = document.querySelector('.moon-icon');
            const htmlEl = document.documentElement;

            const savedTheme = localStorage.getItem('theme') || 'light';
            htmlEl.setAttribute('data-theme', savedTheme);
            updateIcons(savedTheme);

            function updateIcons(theme) {
                if (theme === 'dark') {
                    sunIcon.style.display = 'none';
                    moonIcon.style.display = 'inline';
                } else {
                    sunIcon.style.display = 'inline';
                    moonIcon.style.display = 'none';
                }
            }
            
            themeToggle.addEventListener('click', () => {
                const currentTheme = htmlEl.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                htmlEl.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateIcons(newTheme);
            });

            const productGrid = document.getElementById('product-grid');
            const cardTemplate = document.getElementById('product-card-template');
            const skeletonTemplate = document.getElementById('skeleton-card-template');

            function renderSkeletons() {
                productGrid.innerHTML = '';
                for (let i = 0; i < 6; i++) {
                    const skeleton = skeletonTemplate.content.cloneNode(true);
                    productGrid.appendChild(skeleton);
                }
            }
            
            function renderProducts() {
                productGrid.innerHTML = '';
                products.forEach(product => {
                    const card = cardTemplate.content.cloneNode(true);
                    
                    const img = card.querySelector('.product-card__image');
                    img.src = product.image;
                    img.alt = product.title;

                    const tag = card.querySelector('.product-card__tag');
                    if (product.tag) {
                        tag.textContent = product.tag;
                    } else {
                        tag.remove();
                    }
                    
                    card.querySelector('.product-card__title').textContent = product.title;
                    card.querySelector('.product-card__price').textContent = `R$ ${product.price.toFixed(2).replace('.', ',')}`;
                    card.querySelector('.product-card__rating span:last-child').textContent = product.rating.toFixed(1);
                    
                    productGrid.appendChild(card);
                });
            }

            renderSkeletons();
            setTimeout(() => {
                renderProducts();
            }, 2000); 
        });
    </script>
</body>
</html>
